# GitHub Actions CI for Aarsu.
#
# INSTALL: this file is kept under docs/ because the automation identity used to
# push this branch does not have `workflows` permission. To enable CI, move it to
# `.github/workflows/ci.yml` (GitHub UI: "Add file" -> paste, or locally:
#   mkdir -p .github/workflows && git mv docs/ci.github-actions.yml .github/workflows/ci.yml
# ) and push with a credential that has the `workflows` scope.
#
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit + API contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high || true
